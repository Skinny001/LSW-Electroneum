[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
electroneum_testnet = "https://rpc.ankr.com/electroneum_testnet"
electroneum_mainnet = "https://rpc.electroneum.com"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options